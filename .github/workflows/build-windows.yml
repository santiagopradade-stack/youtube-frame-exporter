name: Build Studio Moka Windows EXE

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: python -m pip install --requirement requirements-build.txt

      - name: Run tests
        shell: powershell
        run: |
          $env:PYTHONPATH = Join-Path $PWD "src"
          python -m unittest discover -s tests -v

      - name: Build one-file executable
        shell: powershell
        run: |
          $env:DENO_EXE = (Get-Command deno.exe).Source
          python -m PyInstaller --noconfirm --clean StudioMokaFrameExporter.spec

      - name: Create SHA-256 checksum
        shell: powershell
        run: |
          $exe = "dist\Exportador de fotogramas de YouTube - Studio Moka.exe"
          (Get-FileHash -Algorithm SHA256 $exe).Hash + "  " + (Split-Path $exe -Leaf) |
            Set-Content -Encoding ascii dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Moka-Windows-EXE
          path: |
            dist/Exportador de fotogramas de YouTube - Studio Moka.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

