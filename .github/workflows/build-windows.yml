name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.2
      - name: Download Deno runtime
        shell: powershell
        run: .\download_deno.ps1
      - name: Build executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --add-binary "deno.exe;."
          --name YouTubeFrameExporter --collect-all imageio_ffmpeg
          --collect-all yt_dlp --collect-all yt_dlp_ejs app.py
      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeFrameExporter-Windows
          path: dist/YouTubeFrameExporter.exe
          if-no-files-found: error
